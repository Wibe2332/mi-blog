<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>

    <header>
        <h1>Panel de Administración</h1>
        <a href="/logout">Cerrar sesión</a>
    </header>

    <main>
        <section class="admin-form">
            <h2 id="form-titulo">Crear nuevo post</h2>
            <input type="hidden" id="post-id">
            <input type="text" id="input-titulo" placeholder="Título del post">
            <textarea id="input-contenido" placeholder="Contenido del post" rows="5"></textarea>
            <button id="btn-guardar">Guardar post</button>
            <button id="btn-cancelar" style="display: none;">Cancelar edición</button>
        </section>

        <section id="lista-posts">
            <!-- Aquí JavaScript va a insertar los posts -->
        </section>
    </main>

    <script src="/static/js/admin.js"></script>
</body>
</html>
